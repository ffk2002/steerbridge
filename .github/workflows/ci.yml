name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type Check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Setup Database
        run: |
          npx prisma migrate deploy
          npx prisma db seed
        env:
          DATABASE_URL: "file:${{ github.workspace }}/prisma/dev.db"

      - name: Production Build
        run: npm run build
        env:
          DATABASE_URL: "file:${{ github.workspace }}/prisma/dev.db"
